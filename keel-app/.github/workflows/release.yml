name: Release Keel
# Builds the Windows installer and publishes it to your releases repo. The installed app updates itself from there.
# Run it from the Actions tab: "Run workflow", type the new version (for example 0.2.1). No command prompt needed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: New version number, higher than the last one (for example 0.2.1)
        required: true
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm version ${{ github.event.inputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
